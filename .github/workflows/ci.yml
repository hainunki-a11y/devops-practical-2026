name: CI

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build
        run: python src\app.py

      - name: Test
        shell: pwsh
        run: |
          if (Test-Path "tests") {
            python -m pytest
          } else {
            Write-Output "No tests found; skipping pytest"
          }

      - name: Deploy
        shell: pwsh
        run: |
          if (Test-Path "deploy.bat") {
            .\deploy.bat
          } else {
            Write-Output "No deploy.bat found; skipping deploy"
          }
